---
# Real org data (not demo data — see examples/org.yaml for that). Referenced
# from app-config.production.yaml's catalog.locations. The
# emailLocalPartMatchingUserEntityName sign-in resolver
# (app-config.production.yaml's auth.providers.microsoft) matches the local
# part of the email claim from Microsoft Entra ID against metadata.name
# below (not spec.profile.email — that broke across a logout/re-login when
# Entra returned a different domain for the same identity).
apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: cassio
spec:
  profile:
    email: cassio@cmoreira.dev
  memberOf: [platform-team]
---
# Default owner for every cmoreira-dev repo's catalog-info.yaml — a single
# homelab maintainer today, but keeps ownership modeled as a team rather
# than a hardcoded person so it doesn't need touching if that ever changes.
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: platform-team
spec:
  type: team
  children: []
