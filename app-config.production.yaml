app:
  # Should be the same as backend.baseUrl when using the `app-backend` plugin.
  baseUrl: https://backstage.cmoreira.dev

# app-config.yaml's default (generator.runIn: 'docker') spawns a Docker
# container to run `mkdocs build` — there's no Docker socket in this pod.
# 'local' runs mkdocs as a subprocess directly instead; the Dockerfile
# installs it (mkdocs-techdocs-core) for that to work.
#
# Security trade-off: 'local' runs mkdocs (and whatever plugins/macros/hooks
# a repo's mkdocs.yml pulls in — mkdocs supports arbitrary Python there) as
# a subprocess directly inside this backend container, with the same
# filesystem/env access as the backend process itself (GITHUB_TOKEN, DB
# creds, Entra/GitHub OAuth secrets). 'docker' mode sandboxed generation in
# an isolated container instead. This is acceptable ONLY because catalog
# discovery (catalog.providers.github in app-config.yaml) is scoped to the
# cmoreira-dev org, i.e. every repo whose docs get built here is one this
# account already owns — there's no untrusted third-party content flowing
# through techdocs-ref. Revisit if that scoping ever widens.
techdocs:
  generator:
    runIn: 'local'

backend:
  # Note that the baseUrl should be the URL that the browser and other clients
  # should use when communicating with the backend, i.e. it needs to be
  # reachable not just from within the backend host, but from all of your
  # callers. When its value is "http://localhost:7007", it's strictly private
  # and can't be reached by others.
  baseUrl: https://backstage.cmoreira.dev

  cors:
    origin: https://backstage.cmoreira.dev

  # config options: https://node-postgres.com/apis/client
  database:
    client: pg
    connection:
      host: ${POSTGRES_HOST}
      port: ${POSTGRES_PORT}
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}
      # https://node-postgres.com/features/ssl
      # you can set the sslmode configuration option via the `PGSSLMODE` environment variable
      # see https://www.postgresql.org/docs/current/libpq-ssl.html Table 33.1. SSL Mode Descriptions (e.g. require)
      # ssl:
      #   ca: # if you have a CA file and want to verify it you can uncomment this section
      #     $file: <file-path>/ca/server.crt

# Guest auth is gone in production — sign-in is Microsoft Entra ID only, via
# an App Registration in the cmoreira-dev tenant (values below sourced from
# SSM, see gitops.backstage.homelab/helm/backstage/templates/externalsecret.yaml).
# The permission policy in packages/backend/src/index.ts is still allow-all:
# with guest auth removed, that just means "any signed-in org member is a
# full admin", which is an acceptable default for a single-tenant homelab
# portal — revisit if/when this ever needs per-user restrictions.
auth:
  # Controls which keyed environment (auth.providers.microsoft.<env> below)
  # the frontend requests — defaults to "development" if unset, which is a
  # separate thing entirely from the backend's NODE_ENV and has nothing
  # wiring it automatically. Without this the frontend calls
  # /api/auth/microsoft/start?...&env=development, and the backend 404s:
  # "No configuration available for the 'development' environment".
  environment: production
  providers:
    microsoft:
      # Keyed by environment (NODE_ENV=production in the Dockerfile), not a
      # flat object — the provider's config.schema.json declares
      # auth.providers.microsoft as a map of env name -> provider config.
      production:
        clientId: ${AUTH_MICROSOFT_CLIENT_ID}
        clientSecret: ${AUTH_MICROSOFT_CLIENT_SECRET}
        tenantId: ${AUTH_MICROSOFT_TENANT_ID}
        signIn:
          # emailMatchingUserEntityProfileEmail broke sign-in after a
          # logout/re-login: confirmed live that the Entra token's email
          # claim isn't stable across sessions — it came back as
          # cassio@rapporthub.pt this time, not cassio@cmoreira.dev (the
          # value in org/users.yaml), even though `az ad signed-in-user
          # show` reports cassio@cmoreira.dev as the account's `mail`.
          # Matching on the local part instead of the full address, scoped
          # to the two domains this identity is known to show up as, is
          # robust to whichever one Entra hands back on a given login.
          resolvers:
            - resolver: emailLocalPartMatchingUserEntityName
              allowedDomains:
                - cmoreira.dev
                - rapporthub.pt
    # Not a sign-in path — Microsoft is the only one wired into the frontend
    # SignInPage. This exists purely so the GitHub Actions plugin can obtain
    # a GitHub-scoped token for the signed-in user (lazy OAuth popup the
    # first time that tab is opened). dangerouslyAllowSignInWithoutUserInCatalog
    # is safe here precisely because it can't grant a Backstage identity —
    # only used as a secondary token source for one plugin's API calls.
    github:
      production:
        clientId: ${AUTH_GITHUB_CLIENT_ID}
        clientSecret: ${AUTH_GITHUB_CLIENT_SECRET}
        signIn:
          resolvers:
            - resolver: usernameMatchingUserEntityName
              dangerouslyAllowSignInWithoutUserInCatalog: true

catalog:
  # Overrides the default list locations from app-config.yaml as these contain example data.
  # See https://backstage.io/docs/features/software-catalog/#adding-components-to-the-catalog for more details
  # on how to get entities into the catalog.
  locations:
    # Local example data, replace this with your production config, these are intended for demo use only.
    # File locations are relative to the backend process, typically in a deployed context, such as in a Docker container, this will be the root
    - type: file
      target: ./examples/entities.yaml

    # Local example template
    - type: file
      target: ./examples/template/template.yaml
      rules:
        - allow: [Template]

    # Local example organizational data
    - type: file
      target: ./examples/org.yaml
      rules:
        - allow: [User, Group]

    # Real org data — see org/users.yaml.
    - type: file
      target: ./org/users.yaml
      rules:
        - allow: [User, Group]

    # Product/platform groupings — see org/systems.yaml.
    - type: file
      target: ./org/systems.yaml
      rules:
        - allow: [System]
